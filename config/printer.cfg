# =====================================================================
# Anycubic Mega Zero (V1) - TWO-MCU Klipper config
# Rebuilt 2026-11-06 for the big hardware reorg.
# Pre-reorg single-MCU config kept as printer.cfg.pre-reorg-2026-11-06.
#
#   MCU "avr"  = stock Trigorilla Zero (ATmega1284P), CH340 USB
#                -> X, Y, Z0, Z1 steppers; X/Y endstops; part fan; display
#   MCU "pico" = RP2040-ZERO (chip id E6614C3093449930), native USB
#                -> EXTRUDER stepper (DRV8825), hotend heater+thermistor,
#                   heated bed, capacitive Z probe, 24 V PSU mains relay
#
# BOARD SWAPPED 2026-11-11: full-size RP2040 (E660C0D1C751B926) -> RP2040-Zero
# (E6614C3093449930). A new board means a new chip id, a new by-id path AND a
# fresh `usbipd bind` as administrator - the bind is per bus position, so it
# does not carry over.
#
# *** BOTH Z STEPPERS MUST SHARE ONE MCU. *** Klipper refuses to home an axis
# whose steppers live on different MCUs:
#     "Multi-mcu homing not supported on multi-mcu shared axis"
# Z0 on the pico with Z1 on the AVR made Z completely unhomeable. Keeping both
# on the AVR with the probe on the pico is ORDINARY multi-MCU homing, which IS
# supported - the standard CAN-toolhead arrangement. Do not split Z again.
#
# BOTH USB devices must be attached before klippy starts. A missing MCU is a
# FATAL config error, not a warning - it will not come up half-working.
# All three (AVR fw, RP2040 fw, host) must be Klipper v0.13.0 / 61c0c8d.
#
# ------------------------------------------------------- AVR driver map
# Current, after the 2026-11-08 rework (Option C):
#   E driver  -> Z0         (step PB1, dir PB0, en !PD6)
#   Z driver  -> Z1         (step PB3, dir PB2, en !PA5)
#   Y driver  -> Y          unchanged
#   X driver  -> X          unchanged
#   EXTRUDER  -> NOT on this board; it is on the pico's DRV8825.
#
# How this landed, since it went back and forth: the 2026-11-06 reorg put Z0 on
# the E driver and the extruder on the pico. On 2026-11-08 those were swapped,
# because the E driver appeared unable to lift the gantry. Then the real config
# refused to load at all - splitting Z across two MCUs makes it unhomeable - so
# they were swapped BACK. The E driver's apparent weakness was never actually
# confirmed: it was tested with over-tight V-wheels and its trimpot was never
# turned up.
#
# Freed up on the AVR and unused: PD4 (old bed output), PD5 (old hotend heater,
# now the only candidate if the heatbreak fan is ever made switchable),
# PA6/PA7 (old thermistor ADCs), PC4 (old Z-STOP / probe input).
#
# ------------------------- RP2040-ZERO pin map (rewired 2026-11-11)
#  gpio0   24 V PSU mains relay (opto SSR)
#  gpio1   Z probe  - NOW FED FROM 12 V, no relay in its path
#  gpio2   HOTEND heater - MOSFET module trigger (single pin)
#  gpio3   extruder DRV8825 DIR
#  gpio4   extruder DRV8825 STEP
#  gpio5   extruder DRV8825 EN (active low)  - driver fed from 12 V
#  gpio6   BED heater - IBT-2 RPWM (single pin)
#  gpio28  HOTEND thermistor, 4.7k pullup   <- MEASURED, not assumed
#  gpio29  BED thermistor, 4.7k pullup      <- MEASURED, not assumed
#
# Nine pins, where the old full-size board used twenty. The hotend BTS7960 was
# replaced by a small MOSFET module (one pin instead of six), and the bed IBT-2
# now has R_EN/L_EN tied to VCC and LPWM tied to GND in hardware, so it needs
# only RPWM. The four _IS current-sense pins are gone entirely - they were never
# usable, being analog outputs landed on digital pins with no Klipper support.
#
# THERMISTORS WERE MEASURED, NOT TRACED. A bounded 5 s hotend pulse moved gpio28
# by 7.1 C and left gpio29 flat. Take such readings BACK TO BACK in one run - a
# first attempt compared against a baseline from minutes earlier showed only
# +0.3 C and looked like nothing had happened.
#
# WHAT THE 12 V MOVES BOUGHT:
#  - The PROBE no longer depends on the relay. The failure where homing with the
#    rail off drove the nozzle into the bed (because an unpowered probe read
#    `open`) is structurally gone, not just guarded against.
#  - The EXTRUDER DRIVER no longer depends on the relay either.
#  Only the two heaters still sit behind it, which is exactly what it is for.
# =====================================================================

[mcu]
serial: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
baud: 250000

[mcu pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6614C3093449930-if00
# RP2040-ZERO as of 2026-11-11. The old full-size board was
# E660C0D1C751B926 - a new board means a new chip id AND a fresh
# `usbipd bind` as administrator.

[printer]
kinematics: cartesian
max_velocity: 200
max_accel: 3000           # RAISED 2026-11-16. An accel tower (500/1000/1500/2000/
                          # 3000 mm/s2 in 5 mm bands, constant 80 mm/s wall speed) showed NO
                          # visible difference between bands - no ringing, no layer shift. The
                          # AVR is idle at mcu_awake 0.003, so the electronics were never the
                          # limit. NOTE this is only a default: Orca overrides it per-feature
                          # with SET_VELOCITY_LIMIT, which is NOT clamped by this value.
max_z_velocity: 5
max_z_accel: 100

# Allows STEPPER_BUZZ / FORCE_MOVE for the direction checks below.
# With TWO Z motors this is no longer optional - see the bring-up order.
[force_move]
enable_force_move: True

# ============================================================ motion (AVR)
# rotation_distance = 200 full steps * 16 microsteps / steps_per_mm
#   X,Y: 3200/80 = 40        Z: 3200/400 = 8
# Marlin INVERT_X_DIR/INVERT_Y_DIR were true -> leading '!' on dir_pin.
# X/Y endstops: stock Marlin *_MIN_ENDSTOP_INVERTING = false -> NO '!'.

[stepper_x]
step_pin: PD7
dir_pin: !PC5
enable_pin: !PD6            # shared enable: X, Y and Z0 all sit on PD6.
                            # The extruder no longer does - it is on the pico.
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC2
position_endstop: -9        # stock X_MIN_POS is -9: endstop is past the bed edge
position_min: -9
position_max: 185        # MEASURED 2026-11-12: real X travel ends at 185.
                         # It was 220, so ANY move past 185 ground the carriage
                         # into the frame and LOST STEPS - after which every
                         # reported position is fiction. This is what broke
                         # BED_MESH_CALIBRATE: mesh_max X=150 -> nozzle X=200.
homing_speed: 50

[stepper_y]
step_pin: PC6
dir_pin: !PC7
enable_pin: !PD6
microsteps: 16
rotation_distance: 40
endstop_pin: ^PC3
position_endstop: 0
position_max: 220
homing_speed: 50

# ---- Z0: carries the probe/endstop definition ----
# Klipper homes Z using stepper_z's endstop_pin and moves stepper_z1 in lockstep.
[stepper_z]
# Z0. BACK ON THE AVR E DRIVER as of 2026-11-08 (Option C).
#
# WHY: Klipper refuses to home an axis whose steppers live on DIFFERENT MCUs -
#   "Multi-mcu homing not supported on multi-mcu shared axis"
# Z0 on the pico with Z1 on the AVR made Z unhomeable, full stop. Both Z
# steppers must share one MCU. Probe-on-pico with both Z on the AVR is ORDINARY
# multi-MCU homing, which Klipper does support - it is the standard CAN
# toolhead arrangement.
step_pin: PB1
dir_pin: PB0                # PLAIN - VERIFIED 2026-11-08 on the final hardware.
                            # A coordinated `G1 Z` move (both screws locked
                            # together as one kinematic axis) lifted the gantry
                            # cleanly. Matches Z1 on plain PB2; both screws turn
                            # the same way and clockwise lifts.
enable_pin: !PD6            # shared with X, Y and the extruder - see note below
microsteps: 16              # A4988 on this board is hardwired to 1/16
rotation_distance: 8        # T8x8, matching Z1
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 250

# E-DRIVER CURRENT: fine as found. The trimpot was never touched.
# This driver was blamed at length for "failing to lift the gantry" and was
# innocent - it lifts it cleanly. The actual causes were over-tight V-slot
# wheels, and later a DRV8825 wound to 3.18 A that was tripping its thermal
# shutdown. If Z0 ever DOES stall, raise this pot a little - but MEASURE,
# because too MUCH current looks exactly like too little.

[stepper_z1]
# Z1 - unchanged throughout. The reference the pair is matched against.
step_pin: PB3
dir_pin: PB2                # PLAIN. Turns clockwise for a positive command, and
                            # clockwise lifts. Both screws MUST rotate the same
                            # way; if one is flipped the pair fights and racks
                            # the gantry.
enable_pin: !PA5
microsteps: 16
rotation_distance: 8        # CHECK the second screw really is 8 mm/rev. A T8x2
                            # would be 4x out and would rack the gantry.

[extruder]
# Stepper BACK ON THE PICO's DRV8825 as of 2026-11-08 (Option C), so that both
# Z steppers can share the AVR and Z becomes homeable.
# The heater and thermistor were already on the pico, so the whole extruder now
# lives on one MCU.
step_pin: pico:gpio4
dir_pin: pico:gpio3         # NOT inverted as of 2026-11-13: the DIRECT DRIVE
                            # extruder runs the other way. With the old "!" it
                            # backed filament OUT on a positive E move.
                            # (The "!" was correct for the old bowden extruder.)
                            # Plain gpio3 fed filament OUT on a positive E move.
                            # Direction did not carry over from the old board,
                            # which is expected: DIR moved to a different pin.
                            #
                            # Vref set to 0.45 V = 0.9 A at the same time. At the
                            # inherited 0.65 V (1.3 A, chosen for the 1.5 A Z
                            # motor) this driver buzzed and stalled on sustained
                            # 50 mm moves while short 5-10 mm moves worked - the
                            # DRV8825 thermal-shutdown signature. An extruder
                            # needs far less current than an axis motor, and a
                            # GEARED one less still.
enable_pin: !pico:gpio5     # DRV8825 ENABLE is active LOW.
                            # The driver now runs from 12 V, so the
                            # extruder no longer depends on the relay.
microsteps: 16              # DRV8825 DIPs: 1 ON, 2 OFF, 3 OFF = 1/16.
                            # The block is silkscreened MS3, MS2, MS1 LEFT TO
                            # RIGHT, so switch 1 is the MOST significant bit.
step_pulse_duration: 0.000004
                            # DRV8825 minimum STEP pulse is 1.9 us against
                            # Klipper's 2 us default - a 5% margin, free to
                            # remove at extruder step rates.
#
# *** Vref IS CURRENTLY SET FOR THE Z MOTOR: 0.65 V = 1.3 A. ***
# That was chosen for a 1.5 A NEMA 17 lifting a gantry. An extruder usually
# wants LESS - commonly 0.8-1.0 A - so consider dropping it to ~0.45-0.50 V
# once the extruder motor's rating is known. Sense resistors are R100 (0.1 ohm),
# so Vref = current / 2. The pot is on the purple DRV8825 module itself, a small
# cross-slot screw on its left edge below the two R100 resistors.
# MEASURE WITH THE 24 V RAIL ON - a reading taken with it off is meaningless.
rotation_distance: 22.2    # 22.86 measured (50mm cmd -> 55mm fed at 20.78);
                           # trimmed ~3% for a touch more flow, inside the
                           # +/-2% slop of a ruler-against-filament measurement.
                           # = 2.5x over. Old 8.312 was the GEARED bowden
                           # extruder; the direct drive one is UNGEARED
                           # (20.78/pi = 6.6mm effective MK8 gear).
                           # This was causing ~2.5x over-extrusion on every
                           # print and the extruder skipping.
                            # is the stock value from 385 steps/mm on the old
                            # ungeared drive, so it is wrong by a GEAR RATIO,
                            # not by a few percent. Calibrate from scratch:
                            # mark 120 mm of filament, extrude 100 mm hot,
                            # measure what actually went in, then
                            #   new_rd = old_rd * (actual_mm / 100)
                            # Check DIRECTION first with a short extrude - a
                            # re-geared drive is easily mirrored.
nozzle_diameter: 0.400
filament_diameter: 1.750
pressure_advance: 0.04      # PLACEHOLDER for DIRECT DRIVE 2026-11-13.
                            # Was 0.2, measured for the BOWDEN setup - roughly
                            # 5x too high now. DD typically lands 0.02-0.08.
                            # RE-RUN the TUNING_TOWER sweep to get the real one.
                            # TWO sweeps agree: factor 0.020 (PA 0->0.8) showed
                            # everything above ~0.2 getting WORSE, and factor
                            # 0.005 (PA 0->0.2, 4x the resolution) showed the
                            # top - i.e. 0.2 - cleanest. The first sweep's
                            # "very bottom is best" was an artefact of cramming
                            # 0->0.2 into the bottom 10 mm, where first-layer
                            # squish confounds the read.
                            # 0.2 is LOW for a bowden (0.4-1.0 is typical). The
                            # likely reason is the extruder: a geared DRV8825 at
                            # 0.9 A Vref that has already stalled once on
                            # sustained moves cannot execute the fast
                            # compensating moves a high PA asks for.
                            # Sits at the top edge of the finer sweep, so if
                            # corners still look soft, re-sweep 0.2 -> 0.4
                            # before assuming this is wrong.
heater_pin: pico:gpio2      # hotend MOSFET module - ONE pin, no
                            # enables, no LPWM. Replaced the BTS7960
                            # on 2026-11-11 to save space.
sensor_type: Generic 3950   # INFERRED, NOT VERIFIED, 2026-11-06: unbranded 100k
                            # from an E3D V6 clone kit, which is a 3950 in the
                            # overwhelming majority of cases.
                            # Replaces the stock EPCOS 100K B57560G104F, which
                            # would have read ~10 C LOW at 200 C (i.e. the
                            # hotend running hotter than reported).
                            # A GENUINE E3D V6 ships an ATC Semitec 104GT-2, not
                            # a 3950 - if this turns out to be a real E3D part
                            # the right value is "ATC Semitec 104GT-2".
                            # 3950 is the better guess AND the safer one: see
                            # the block below for why, and how to confirm.
sensor_pin: pico:gpio28     # HOTEND thermistor - MEASURED 2026-11-11
                            # by a bounded 5 s pulse: gpio28 rose
                            # 7.1 C, gpio29 stayed flat.
pullup_resistor: 4700
control: pid
pid_Kp: 22.2                # Klipper's GENERIC constants - and VERIFIED GOOD
pid_Ki: 1.08                # ENOUGH on hardware 2026-11-07, so deliberately
pid_Kd: 114                 # left alone rather than calibrated:
                            #   150 C: overshoot +1.70, settled hold 150.04 C,
                            #          band +/-0.55
                            #   200 C: overshoot +0.90, hold mean 200.45 C,
                            #          band +/-0.45, min 200.00 max 200.90
                            # Climb ~1.4-1.7 C/s. Essentially dead on target at
                            # printing temperature.
                            # PID_CALIBRATE is NOT run here on purpose: there is
                            # nothing left to win, and on the BED the calibrated
                            # set measured WORSE than what it replaced (see
                            # [heater_bed] above). Only re-tune if real printing
                            # shows a problem.
min_temp: 5
max_temp: 250               # Lowered from 260 on 2026-11-06, PTFE-liner unknown.
                            # A genuine V6 keeps PTFE out of the hot zone and is
                            # rated to 285 C, but plenty of clones run the tube
                            # down into the heatbreak, where much above ~240 C
                            # degrades it and releases fumes.
                            #
                            # Read this as: WORKING CEILING ~240 C, guard at 250.
                            # max_temp is a shutdown threshold, not a policy -
                            # it has to sit above the highest target plus PID
                            # overshoot, or PID_CALIBRATE trips it. So 250 gives
                            # the guard headroom; it is NOT permission to print
                            # at 250.
                            #
                            # To settle it: pull the filament and look down the
                            # top of the heatsink, or pull the heatbreak. If the
                            # PTFE tube bottoms out ABOVE the heatbreak, this is
                            # an all-metal-ish hot zone and 260-280 is fine. If
                            # the tube passes INTO the heatbreak, keep targets
                            # under 240 and this at 250.
                            # PLA/PETG both live under 240, so nothing is lost
                            # until you want ABS or nylon.
min_extrude_temp: 170
max_power: 1.0              # correct: 40 W / 24 V cartridge on the 24 V PSU,
                            # confirmed 2026-11-06. ~1.7 A, trivial for a
                            # BTS7960 (43 A part).

# ---- hotend BTS7960 bridge control ----
# Same scheme as the bed: hold the enables high, hold LPWM low so the left
# half-bridge is the ground return, and PWM the heater on RPWM.
#
# These are [output_pin] rather than [static_digital_output] on purpose:
# shutdown_value: 0 means a Klipper fault DISABLES THE BRIDGE ITSELF, not just
# the PWM. The heater then has three independent ways to be off (RPWM low,
# both enables low, PSU relay dropped).
#
# Reassuring property of this wiring: the heater is only energised in ONE pin
# combination (RPWM high AND LPWM low AND both enables high). RPWM and LPWM
# both high, or both low, puts both bridge outputs at the same potential - no
# voltage across the cartridge. So a stuck-high or stuck-low pin fails to OFF.
[output_pin bed_psu]
pin: pico:gpio0             # RP2040-Zero gpio0 as of 2026-11-11
value: 0
shutdown_value: 0

[heater_bed]
heater_pin: pico:gpio6      # IBT-2 RPWM - the ONLY bed control pin
                            # now. R_EN and L_EN are tied to VCC and
                            # LPWM to GND in hardware, so there are no
                            # [output_pin] enable blocks any more.
sensor_pin: pico:gpio29     # BED thermistor - MEASURED 2026-11-11,
                            # not assumed (5 s hotend pulse moved
                            # gpio28 by 7.1 C and left gpio29 flat).
sensor_type: Generic 3950
pullup_resistor: 4700
control: pid                # BENCH constants (bare bed, 2026-10-26) - KEPT
pid_Kp: 53.690              # DELIBERATELY after a head-to-head on 2026-11-07.
pid_Ki: 1.366
pid_Kd: 527.500
                            # PID_CALIBRATE on the MOUNTED bed produced
                            #   Kp 69.071 / Ki 1.225 / Kd 973.902
                            # and those measured WORSE on the same 90 s hold:
                            #            bench      calibrated
                            #   overshoot  +0.3 C      +2.1 C
                            #   hold mean  61.1 C      61.41 C
                            #   hold band  +/-0.15     +/-0.70
                            #   trend      turning over  still CLIMBING
                            # So the calibrated set is not installed. Bigger Kd
                            # with smaller Ki gave more overshoot and a looser
                            # hold, not less.
                            #
                            # *** BUT THE COMPARISON IS NOT SETTLED. *** Neither
                            # run reached steady state: the calibrated run was
                            # still rising monotonically (60.5 -> 62.1) when the
                            # hold ended. This bed cools at ~1.1 C/min, so its
                            # thermal time constant is MINUTES and a 90 s hold
                            # cannot show where it settles. bedrun.py's hold is
                            # fine for proving the heater works and too short to
                            # judge PID. Re-decide with a 10 min hold on each
                            # before trusting either set.
                            #
                            # Both sets hold ~1 C above target, which is a
                            # systematic offset rather than a tuning artefact -
                            # suspect thermistor-to-heater thermal lag (sensor
                            # sees the bed after the element has already gone
                            # past). Worth checking where the sensor is mounted.
min_temp: 0
max_temp: 110               # magnetic PEI sheets are rated ~100 C
max_power: 1.0

# Runaway protection, stated explicitly rather than left to defaults: this bed
# climbs ~21 C/min, so a fault gets somewhere unpleasant quickly.
[verify_heater heater_bed]
max_error: 120
check_gain_time: 60
hysteresis: 5
heating_gain: 2

# ============================================================ fans (AVR)
# Both fans are 12 V and both live on the Anycubic board.
#
# Tested on hardware 2026-11-07 with fantest.cfg (a throwaway config declaring
# only the AVR and three [output_pin]s - no heaters, nothing that could heat).
#   PB4 high  -> PART COOLING fan spins.  VERIFIED.
#   heatbreak fan was ALREADY RUNNING at power-on, before klippy connected, and
#   kept running with PB4, PD4 and PD5 all explicitly driven LOW. So it was on a
#   permanently-live 12 V source, not under board control at all.
# (The PD4 test was inconclusive, not negative: the pin was driven with nothing
#  plugged into that terminal, so there was nothing to observe.)

[fan]
pin: PB4                    # part cooling - VERIFIED on hardware 2026-11-07

# ---- heatbreak fan: DELIBERATELY NOT CONFIGURED ----
# It lives in FAN4 and FAN4 is an UNSWITCHED 12 V header - no MOSFET, nothing
# for Klipper to hold. There is no [heater_fan] section because there is no pin
# to put in one. Its absence here is a finding, not an oversight.
#
# Established on hardware 2026-11-07: the fan kept spinning with PB4, PD4, PD5,
# PA0, PA2 and PA4 ALL ACTIVELY DRIVEN LOW by klippy (not merely floating).
# Those six are every pin on this board that could plausibly be a fan output -
# BUS_PINS_spi=PB6,PB5,PB7 and RESERVE_PINS_serial=PD0,PD1 come from the MCU's
# own config line, and PA6/PA7 (old thermistor ADCs) and PC4 (old Z-STOP) are
# inputs. It also fits the board design: FAN1-FAN4 exist but a Melzi has exactly
# ONE fan MOSFET (PB4), so three of those four headers are 12 V passthroughs.
#
# Residual caveat, for honesty: PB5/PB6/PB7, PA6/PA7 and PC4 were not driven, so
# they are excluded by what the pin map says they are rather than by test. The
# zero-risk way to close it completely is a continuity check with the power OFF:
# if FAN4's negative pin is continuous to PSU ground, there is no MOSFET in that
# path and the matter is settled.
#
# THIS IS THE SAFER ARRANGEMENT AND IS WORTH KEEPING. A heatbreak fan that
# cannot be switched cannot fail to run while the hotend is hot, which is the
# failure that causes heat creep and a jam. The only thing it costs is noise
# while the printer sits idle.
#
# If it is ever moved to a controllable output, PD5 (the freed stock hotend
# terminal) is the one to use - a populated, known-good MOSFET that drove a 40 W
# heater. NOT PD4: that is the bed output and P3/"HOTBAD" is an unpopulated
# footprint on this rev, possibly with no MOSFET or terminal fitted at all.
# The section would then be:
#     [heater_fan hotend_fan]
#     pin: PD5
#     heater: extruder
#     heater_temp: 50.0
#     fan_speed: 1.0
#     shutdown_speed: 1.0    <- set EXPLICITLY, so a Klipper fault leaves the
#                               fan at FULL while the hotend coasts down.
# [heater_fan] not a second [fan], because it keeps running after a print ends
# until the hotend cools; a plain [fan] stops when the print does and heat-soaks
# the filament in the heatbreak into a jam. Cross-MCU is fine (heater on pico,
# fan on AVR) - heater_fan is host-side logic watching a temperature.
# And note what that move would COST: shutdown_speed cannot cover the AVR losing
# power or USB. The pin goes hi-Z and the fan stops with a hot hotend.

# ============================================================ display (AVR)
# Stock 12864 ST7920 + rotary encoder.
[display]
lcd_type: st7920
cs_pin: PA3
sclk_pin: PA1
sid_pin: PC1
encoder_pins: ^PD3, ^PD2
click_pin: ^!PC0

# ============================================================ probe (pico)
# LJC18A3 CAPACITIVE sensor via the PC817 opto module. Signal now lands on
# RP2040 gpio2 instead of the AVR's Z-STOP header (PC4).
#
# *** TWO THINGS CHANGED THAT BOTH INVALIDATE THE OLD CALIBRATION ***
#
# 1. MULTI-MCU HOMING. The probe is now on a different MCU from the Z steppers.
#    Klipper supports this (every CAN toolhead does it) but it adds latency to
#    the trigger, so expect PROBE_ACCURACY to be worse than the 0.0113 mm sigma
#    measured on the AVR. Re-run it and write down the new number before
#    trusting a mesh. If klippy starts throwing "Timer too close" or
#    communication errors during probing, this is the first suspect.
#
# 2. RP2040 pullups are ~50 k against the AVR's ~30 k, so the opto module is
#    driving a weaker pullup. Polarity should still be non-inverted, but
#    QUERY_PROBE it rather than assuming: nothing near -> open, hand -> TRIGGERED.
#    If it reads backwards, check the 2-pin OUT/GND order FIRST. That wiring
#    cost a whole evening once already and survived a dead short, which nearly
#    got a healthy input pin written off as blown.
[probe]
pin: ^!pico:gpio1           # INVERTED - verified on hardware 2026-11-11:
                            # at rest the pin reads HIGH, and triggering the
                            # sensor pulls it LOW. So `!` is required.
                            #
                            # A hardware fix was tried first and did NOT work:
                            # swapping OUT/GND at the opto module does not
                            # cleanly invert an open-collector output the way it
                            # did on the AVR's Z-STOP header - it just stops
                            # working. Wiring was put back as it was.
                            #
                            # *** RESIDUAL RISK, KNOWN AND ACCEPTED. ***
                            # With `!`, a BROKEN OR UNSEATED SIGNAL WIRE floats
                            # HIGH on the pullup and reads `open` - which is
                            # indistinguishable from "not triggered". Z would
                            # then home downwards and never trigger.
                            # The probe now runs from 12 V, so the old
                            # lost-power case is gone; a broken wire is what
                            # remains. This machine has produced two loose
                            # connections in a week, so treat an unexplained
                            # failure to trigger as a WIRING fault first, and
                            # check the probe toggles before any long print.
                            #
                            # THE PROBE NOW RUNS FROM 12 V, not the
                            # relay-switched 24 V. That removes the
                            # whole class of failure where homing
                            # with the rail off crashed the nozzle.
x_offset: -55.0            # MEASURED with a ruler 2026-11-12.
y_offset: -19.0            # MEASURED 2026-11-12: probe is 19mm toward the
                           # plate FRONT of the nozzle in BED coords (it leaves
                           # the front edge before the nozzle does). The probe
                           # body sits physically behind the nozzle - on a bed
                           # slinger those are OPPOSITE signs, which is the trap.
                           # BEHIND the nozzle. The old -15.0 had the WRONG SIGN,
                           # so every probe point was ~34mm from where Klipper
                           # thought, and PROBE_CALIBRATE touched the nozzle down
                           # 34mm away from the probed spot. z_offset is therefore
                           # invalid until re-run.

# z_offset deliberately 0 - see the warning in the bring-up order. 0 is the
# SAFE direction to be wrong in: the nozzle prints in the air. A z_offset that
# is too LARGE drives the nozzle into the plate. The real value comes from
# PROBE_CALIBRATE + SAVE_CONFIG, never from being typed in here.
#z_offset: 0

speed: 3
lift_speed: 5
samples: 5
sample_retract_dist: 2.0
samples_result: median
samples_tolerance: 0.05     # measured range was 0.035-0.05 mm; 0.02 fails constantly
samples_tolerance_retries: 5

# RE-ENABLED 2026-11-08 once the Z0/E plugs were swapped to match the config.
#
# Worth remembering why it was ever off: while the config said Option C but the
# PLUGS had not been swapped, Klipper's stepper_z pins physically drove the
# EXTRUDER motor - so this z_hop spun the extruder ~1.25 revolutions, pushing
# freshly-loaded filament into a COLD hotend during a plain `G28 X`.
# The arithmetic matched exactly: stepper_z 4000 steps / 400 steps per mm = the
# 10 mm hop.
#
# GENERAL LESSON: after any config change that re-maps steppers, G28 moves axes
# you did not ask for. Check what else the config does before homing one axis.
[safe_z_home]
home_xy_position: 160, 125  # puts the PROBE over the bed centre (110,110)
speed: 50
z_hop: 10
z_hop_speed: 5

# Mesh limits are PROBE coordinates: the toolhead ends up at
# (mesh coordinate - offset), which has to stay inside real travel
# (X -9..220, Y 0..220).
[bed_mesh]
speed: 80
horizontal_move_z: 5
mesh_min: 15, 45          # Y45 = lowest printable row (below that is off-plate)
                            # plate for nozzle X>=140, Y>=60. These bounds sit
                            # inside that. Wider values fail with "No trigger on
                            # probe after full movement" - and a failed PROBE
                            # drives Z down the full travel and LOSES THE Z
                            # REFERENCE, which then looks like a dead probe.
mesh_max: 120, 195        # X120 -> nozzle 175 (limit 185); Y195 -> nozzle 214 (limit 220)
probe_count: 5, 5
algorithm: bicubic
# FADE THE MESH OUT WITH HEIGHT. Without this the bed-shape correction is
# applied at EVERY layer, so a 60mm part is still being Z-shifted by the shape
# of the plate at the top - which distorts tall geometry and makes any
# out-of-mesh extrapolation compound all the way up instead of dying out.
# Bed shape only matters for the first few layers.
fade_start: 1.0
fade_end: 10.0
fade_target: 0
# *** DELIBERATELY SMALL AND CENTRAL, 2026-11-11. ***
# The previous 15,15 -> 160,195 mesh FAILED on its very first point with
# "No trigger on probe after full movement" - the probe was hanging off the
# edge of the plate, where a capacitive sensor has nothing to sense.
#
# The real fix is correct x_offset/y_offset (still stale from the old mount -
# see [probe]), because until those are right Klipper does not know where the
# probe actually is and ANY limits are guesswork. This central patch is chosen
# to be robust to that: even if the offsets are out by a couple of centimetres,
# every point still lands well inside the bed.
#
# Once the offsets are measured, widen this back out. The binding constraint is
# the probe reaching, not the bed size:
#     toolhead X must stay in -9..220  ->  probe X in (-9+|xoff|)..(220+xoff)
#     toolhead Y must stay in   0..220  ->  probe Y in      |yoff|..(220+yoff)
algorithm: bicubic
fade_start: 1
fade_end: 10
fade_target: 0
# The -50 mm X offset still costs coverage: the probe only reaches X -59..170,
# so the RIGHT-HAND 50 mm of the bed is extrapolated, not measured.

# ============================================================ 24 V PSU macros
# The 24 V supply is behind a mains relay, so a bare M140/M104 from a slicer
# would set a target with the supply dead and verify_heater would shut the
# printer down a minute later. These overrides make ordinary slicer G-code
# work.
#
# The relay is shared, so it is dropped ONLY when BOTH heaters are at zero.
# That matters: plenty of slicers emit "M140 S0" during the last few layers to
# save power, and a naive override would cut the hotend supply mid-print.
#
# IF THE HOTEND HAS ITS OWN ALWAYS-ON SUPPLY and only the bed is behind the
# relay, delete the M104 and M109 overrides below and drop the extruder term
# from _PSU_OFF_IF_IDLE. Leaving them in is the harmless direction (it just
# energises the 24 V PSU during a hotend-only heat); the reverse is not.

# =====================================================================
# G28 OVERRIDE: assert the relay before homing, because the probe runs off it.
#
# The capacitive probe is powered from the 24 V rail, behind the mains relay on
# gpio9, and bed_psu has `value: 0` - so the relay is OPEN at every startup.
# Without this, every G28 after boot would fail until the relay was asserted by
# hand.
#
# *** THIS IS A CRASH GUARD. DO NOT REMOVE IT. ***
#
# Measured behaviour of this probe as wired on 2026-11-08 (see [probe], which is
# set to ^! to match):
#   sensor idle       -> gpio2 HIGH -> `open`
#   sensor triggered  -> gpio2 LOW  -> `TRIGGERED`
#   sensor UNPOWERED  -> gpio2 HIGH -> `open`     <-- the dangerous one
#
# An unpowered probe is INDISTINGUISHABLE from an untriggered one. So a G28 with
# the rail off would home downwards against a probe that can never trigger, and
# drive the nozzle into the bed. Asserting _PSU_ON here is the only thing
# standing between a fresh boot and that outcome.
#
# Klipper's own "probe triggered prior to movement" check does NOT help here -
# that catches a probe stuck at TRIGGERED, which is the opposite failure.
# EVERY command that moves Z against the probe asserts the rail first. Putting
# the guard only on G28 was not enough - PROBE_CALIBRATE crashed the nozzle into
# the bed on 2026-11-08 because it probes without going through G28 at all.
# If a new probing command is ever used, give it the same treatment.
# UNCOMMENT THIS AT THE SAME TIME AS [z_tilt] BELOW. It cannot be enabled now:
# rename_existing on a command that does not exist is a config error, and
# Z_TILT_ADJUST only exists once [z_tilt] is configured.
[gcode_macro Z_TILT_ADJUST]
rename_existing: Z_TILT_ADJUST_BASE
gcode:
    _PSU_ON
    Z_TILT_ADJUST_BASE {rawparams}

[gcode_macro _PSU_ON]
gcode:
    {% if printer['output_pin bed_psu'].value|float < 0.5 %}
        SET_PIN PIN=bed_psu VALUE=1
        G4 P2000
    {% endif %}
    # The guard matters: without it every M104/M140 pair would re-assert the
    # relay and stack another 2 s settle. It also keeps the relay from
    # chattering - repeated mains inrush into the PSU's input caps.

[gcode_macro _PSU_OFF_IF_IDLE]
gcode:
    {% if printer.heater_bed.target|float <= 0 and printer.extruder.target|float <= 0 %}
        SET_PIN PIN=bed_psu VALUE=0
        {action_respond_info("both heaters off -> 24 V PSU relay dropped")}
    {% endif %}

# *** M140/M104 NO LONGER DROP THE RELAY. *** They used to call
# _PSU_OFF_IF_IDLE on S0, and on 2026-11-08 that CRASHED THE NOZZLE INTO THE
# BED: `M104 S0` dropped the rail, and the PROBE_CALIBRATE issued immediately
# afterwards probed against an unpowered probe, which reads `open` forever on
# this wiring - so Z descended and nothing ever triggered.
#
# The relay powers the PROBE as well as the heaters. Anything that switches it
# off automatically is a trap. Dropping it is now a MANUAL act only (PSU_OFF /
# BED_COOL). The fault-path protection is unaffected: shutdown_value: 0 still
# cuts mains on any Klipper shutdown, which is what actually matters.
[gcode_macro M140]
rename_existing: M140.1
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _PSU_ON
    {% endif %}
    M140.1 S{s}

[gcode_macro M190]
rename_existing: M190.1
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _PSU_ON
    {% endif %}
    M190.1 S{s}

[gcode_macro M104]
rename_existing: M104.1
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _PSU_ON
    {% endif %}
    M104.1 S{s}

[gcode_macro M109]
rename_existing: M109.1
gcode:
    {% set s = params.S|default(0)|float %}
    {% if s > 0 %}
        _PSU_ON
    {% endif %}
    M109.1 S{s}

# Manual equivalents, kept from the bench config.
[gcode_macro BED_HEAT]
gcode:
    {% set t = params.T|default(60)|float %}
    _PSU_ON
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={t}
    {action_respond_info("PSU on, bed target %.0f C" % t)}

[gcode_macro BED_COOL]
gcode:
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET=0
    _PSU_OFF_IF_IDLE

# ============================================================ misc
[firmware_retraction]
retract_length: 0.8         # DIRECT DRIVE as of 2026-11-13 (was 5.0 bowden).
retract_speed: 35           # Short melt path - 5mm would pull filament clear
                            # of the melt zone and into the cold heatbreak.
unretract_extra_length: 0
unretract_speed: 40

[idle_timeout]
timeout: 600

[virtual_sdcard]
path: /home/josh/printer_data/gcodes

# ============================================================ optional: z_tilt
# The real prize for adding a second screw: probe near each screw and level the
# gantry in software instead of by hand. Needs the screw X/Y positions, and
# both points must be reachable by the PROBE (so inside X -59..170 after the
# -50 mm offset) - that is the binding constraint, not the bed.
# Enable only AFTER both Z directions are verified and the probe is recalibrated.
#[z_tilt]
#z_positions:
#    <x>, <y>                # position of the Z0 screw (the E-driver motor)
#    <x>, <y>                # position of the Z1 screw (the Z-driver motor)
#points:
#    <x>, <y>                # a probe point near the Z0 screw
#    <x>, <y>                # a probe point near the Z1 screw
#speed: 50
#horizontal_move_z: 10
#retries: 5
#retry_tolerance: 0.05

# Bed levelling screws - fill in once you know where the new bed's adjusters
# actually sit. Mount them near mid-range: the old bed's front-right screw ran
# out of travel and the other three had to be lowered to meet it.
#[screws_tilt_adjust]
#screw1: 30, 30
#screw1_name: front left
#screw2: 190, 30
#screw2_name: front right
#screw3: 190, 190
#screw3_name: back right
#screw4: 30, 190
#screw4_name: back left
#horizontal_move_z: 10
#speed: 80
#screw_thread: CW-M4

# =====================================================================
# BRING-UP ORDER - the reorg touched everything, so this starts from zero.
# Do NOT skip to G28. Two Z motors that disagree will rack the gantry.
#
#  0. Identify the new hotend's thermistor and set sensor_type to match (see
#     the thermistor block above). Set the DRV8825 current (Vref) for the new
#     extruder motor. Then attach BOTH USB devices (usbipd, hardware-ids
#     1a86:7523 and 1d50:614e) and confirm klippy connects to both MCUs before
#     touching the hardware.
#     (Hotend voltage is settled: 40 W / 24 V cartridge, max_power 1.0.)
#
#  1. THERMAL, with the heaters cold and the PSU relay off:
#     M105 -> hotend AND bed must both read room temperature. A reading of ~0,
#     ~-270 or several hundred C means a wrong sensor PIN.
#     *** This step proves the PIN, not the CURVE. *** EPCOS and Generic 3950
#     are both 100k at 25 C and agree to a fraction of a degree at room
#     temperature; they only diverge when hot. A correct room reading is NOT
#     evidence that sensor_type is right.
#     STOP on anything odd; do not set a target to "see what happens".
#
#  2. QUERY_ENDSTOPS -> X and Y read open at rest, TRIGGERED when pressed.
#     QUERY_PROBE    -> open with nothing near, TRIGGERED with a hand near.
#
#  3. *** Z DIRECTION, ONE MOTOR AT A TIME, GANTRY FREE TO MOVE ***
#     This is the step the second screw makes dangerous. With the other motor
#     held by its driver, a wrong direction on one is a lever against the frame.
#       FORCE_MOVE STEPPER=stepper_z  DISTANCE=5 VELOCITY=5   -> must go UP
#       FORCE_MOVE STEPPER=stepper_z1 DISTANCE=5 VELOCITY=5   -> must go UP
#     Use single one-way moves, not STEPPER_BUZZ (too ambiguous to read by eye).
#     Fix dir_pin on whichever is wrong, restart, re-test. Only when BOTH rise
#     together on their own, move on. Then check they rise by the SAME amount -
#     unequal travel means mismatched screw lead, not a direction problem.
#
#  4. X and Y: FORCE_MOVE each 15 mm; both must move AWAY from their endstop.
#     Then G28 X, G28 Y separately.
#
#  5. Motor current: Z0 is on the old E-driver trimpot, which was set for an
#     extruder, not a leadscrew. If Z0 stalls, buzzes or loses steps under the
#     gantry weight, that pot is the first thing to look at - not the config.
#
#  6. *** PROBE MUST BE BOLTED TO THE GANTRY BEFORE ANY G28 Z. ***
#     Z homes on the probe. Loose on the bench it never triggers, so Z drives
#     its full travel into the bed.
#     Then: G28, PROBE_CALIBRATE -> paper test -> ACCEPT -> SAVE_CONFIG.
#     WIPE THE NOZZLE FIRST. Ooze or a dried blob makes the paper drag early,
#     by ~0.6 mm - the same order as the thing being measured. Three of four
#     calibration attempts were wrong this way last time.
#
#  7. PROBE_ACCURACY. Compare against the pre-reorg numbers and expect worse,
#     because homing is now cross-MCU:
#        TL-W5MC1 inductive, on AVR   range 0.010 mm   sigma 0.0028
#        LJC18A3 capacitive, on AVR   range 0.035 mm   sigma 0.0113
#        LJC18A3 capacitive, on pico  range ?          sigma ?       <- fill in
#
#  8. PID_CALIBRATE HEATER=extruder TARGET=200, then SAVE_CONFIG.
#     Settle sensor_type FIRST (step 0). PID constants measured on the wrong
#     thermistor curve are tuned to the wrong temperature, and redoing the
#     curve later invalidates them.
#     PID_CALIBRATE HEATER=heater_bed TARGET=60 - the M140 override now
#     asserts the relay, but PID_CALIBRATE does NOT, so run BED_HEAT first
#     (or SET_PIN PIN=bed_psu VALUE=1) before calibrating the bed.
#
#  9. Extruder rotation_distance. The gearing changed, so this is a from-scratch
#     calibration, not a tweak: mark 120 mm of filament at the entry, extrude
#     100 mm at low speed with the hotend hot, measure what actually went in.
#       new_rd = old_rd * (actual_mm / 100)
#     Repeat until it lands within ~0.5 mm. Check the DIRECTION first with a
#     short extrude - a re-geared drive can easily be mirrored.
#     If the first test extrusion over-runs by almost exactly 8x, the DRV8825
#     DIP block is silkscreened in the reverse order and 1-0-0 selected 1/2
#     step rather than 1/16. That is a hardware fix, not a rotation_distance
#     one - do not calibrate it away.
#
# 10. BED_MESH_CLEAR, hand-level, then BED_MESH_CALIBRATE. Always clear first
#     or Klipper compensates and hides the error you are trying to remove.
#
# 11. Re-check z_offset at real bed temperature. The capacitive sensor drifts
#     with temperature, and the bed is now actually heated - that was never
#     true for any previous calibration. (Hotend drift alone was only
#     -0.047 mm, so the hotend is not the worry; the hot bed is untested.)
# =====================================================================

# ===========================================================================
# Mainsail / slicer support, added 2026-11-12
#
# NOTE: [display_status] is deliberately NOT declared here - this config has
# [display] (the 12864 ST7920), which provides display_status implicitly.
# Declaring both is a config error.
#
# PRINT_START exists because Orca's default start gcode for the Klipper base
# emits "PRINT_START EXTRUDER=... BED=...". Without this macro a print aborts
# on an unknown command - and because there is no G28 in the slicer's own
# start block, it would never home either. Defining it here is far more
# robust than fighting Orca's machine-preset format.
#
# It calls M140/M190/M104/M109, which are OVERRIDDEN in this config to drive
# the 24V relay - do not replace them with SET_HEATER_TEMPERATURE or the
# relay logic is bypassed.
# ===========================================================================
[pause_resume]
[exclude_object]
[respond]
[gcode_macro PRINT_START]
description: Called by the slicer at the start of a print
gcode:
    {% set BED = params.BED|default(75)|float %}
    {% set EXTRUDER = params.EXTRUDER|default(235)|float %}
    M140 S{BED}
    M104 S{EXTRUDER}
    G28
    M190 S{BED}
    M109 S{EXTRUDER}
    BED_MESH_PROFILE LOAD=default
    G90
    M83
    G1 Z5 F600
    # L-SHAPED PRIME at Y80.
    # Y80 because the COMGROW logo is screen-printed on the PEI and takes no
    # adhesion; Y20-25 runs off the front edge. The second leg turns 90 deg
    # because two parallel passes 0.4 mm apart merge and clump in PETG.
    # MOVED 2026-11-16: was X40,Y80 -> X180,Y80 -> X180,Y170, which ran 60 mm
    # past mesh_max X120 onto bed Klipper has never measured. The bedmap print
    # showed the COMGROW logo sits ENTIRELY in front of Y45, so the old "Y80 to
    # clear the logo" rule was ~35 mm over-cautious. Now an L down the left-front
    # of the meshed area: X18 Y150 -> X18 Y50 -> X60 Y50. Clear of the logo, and
    # clear of parts, which Orca now centres on (67.5, 120).
    # PURGE BEFORE DRAWING ANYTHING. After the heat-up soak the nozzle has
    # oozed its melt zone empty, so the first several mm of ANY extrusion just
    # refills it - which is why the prime line drew nothing, the first layer
    # was missing, and it then clumped once flow finally caught up.
    PURGE_AND_WIPE
    # back to the plate for the prime line - PURGE_AND_WIPE leaves the
    # toolhead at the bucket/pad, and RESTORE_GCODE_STATE does not move it.
    G1 X18 Y150 F6000
    G1 Z0.200 F300
    # give back what PURGE_AND_WIPE held, or the prime line starts starved
    G1 E{printer["gcode_macro PURGE_AND_WIPE"].exit_retract} F300
    # TOP UP before drawing. The ooze dwell and the pad wipe drain the melt
    # zone, so giving back only the retract leaves the nozzle dry and the first
    # half of the prime line never appears.
    G1 E4 F120
    G1 X18 Y50 E3.33 F1200
    G1 X60 Y50 E1.40 F1200
    # NOT G10. A 5 mm firmware retract is invisible to the slicer, so the print
    # started ~5 mm starved - roughly 150 mm of travel extruding nothing. A 1 mm
    # plain retract is enough to stop travel stringing and recovers immediately.
    # NO trailing retract here. Orca emits its own balanced pair right
    # after PRINT_START (G1 E-0.8 ... G1 E0.8), so anything retracted
    # here is never given back - the first ~30mm of printing is spent
    # refilling it, which reads as a "too high, starved" first layer
    # and does not respond to z_offset at all.
    G1 Z2 F600
    G92 E0
[gcode_macro PRINT_END]
description: Called by the slicer at the end of a print
gcode:
    G10
    G91
    G1 Z10 F600
    G90
    G1 X10 Y200 F3000
    TURN_OFF_HEATERS
    M107
    M84
[gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL]
description: Park the toolhead clear of the part
variable_extrude: 1.0
gcode:
    {% set z_park = 10.0 %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% set z_safe = [act_z + z_park, max_z]|min - act_z %}
    SAVE_GCODE_STATE NAME=PAUSE_state
    G91
    # Guard the retract: CANCEL_PRINT runs TURN_OFF_HEATERS first, so by the
    # time we park the hotend may be below min_extrude_temp and Klipper
    # refuses with "Extrude below minimum temp" - which aborted the whole
    # cancel and left the print stuck in PAUSED.
    {% if printer.extruder.can_extrude %}
    G1 E-{extrude} F2100
    {% else %}
    {action_respond_info("hotend too cold to retract - skipping")}
    {% endif %}
    G1 Z{z_safe} F900
    G90
    G1 X10 Y200 F3000
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=0
[gcode_macro PAUSE]
description: Pause the running print
rename_existing: PAUSE_BASE
gcode:
    PAUSE_BASE
    _TOOLHEAD_PARK_PAUSE_CANCEL
[gcode_macro RESUME]
description: Resume the running print
rename_existing: RESUME_BASE
gcode:
    {% set e = printer["gcode_macro _TOOLHEAD_PARK_PAUSE_CANCEL"].extrude|float %}
    G91
    M83
    {% if printer.extruder.can_extrude %}
    G1 E{e} F2100
    {% endif %}
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=60
    RESUME_BASE
[gcode_macro CANCEL_PRINT]
description: Cancel the running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    _TOOLHEAD_PARK_PAUSE_CANCEL
    CANCEL_PRINT_BASE
    M107
    M84

[z_tilt]
# Screws are NEMA 17s on the 20mm face of the Z extrusions, 396mm across the
# frame + one NEMA body = ~438mm apart, centred on bed X=110, and set back
# ~35mm in Y from the nozzle plane.
# NOTE: both probe points sit LEFT of bed centre because x_offset -55 limits
# the probe to bed X 0..130. Leverage on the right screw is therefore weak -
# expect an extra iteration rather than a bad result.
z_positions:
    -109, 85
    329, 85
points:
    20, 120
    115, 120
speed: 80
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.05

[gcode_macro PURGE_AND_WIPE]
description: Purge a line into the bucket, then scrub the nozzle on the 3M pad
# Bucket runs X0-X135 at Y17, Z0 (it hangs below the PEI on the old unheated
# aluminium bed). Purging as a LINE along it, rather than a blob in one spot,
# stops the extrudate coiling back onto the nozzle.
# Pad is X160-X185; wipe at Z2.2.
#
# RETRACT HAPPENS BEFORE THE SCRUB, on purpose: depressurising while the
# nozzle is on the pad means the ooze that comes out as pressure drops gets
# wiped off here instead of drooling onto the plate during the travel.
#
# wipe_jitter nudges Y pseudo-randomly between passes so the nozzle never
# tracks the same groove and keeps meeting fresh abrasive.
variable_purge_x1:    0.0
variable_purge_x2:    135.0
variable_purge_y:     17.0
variable_purge_z:     0.0
variable_prime_mm:    3.0     # DD melt zone is tiny (was 10.0 for bowden)
variable_purge_mm:    4.0     # was 8.0 for bowden
variable_purge_feed:  900
variable_wipe_x1:     160.0
variable_wipe_x2:     185.0
variable_wipe_z:      2.2
variable_wipe_passes: 6
variable_wipe_jitter: 2.0
variable_ooze_dwell:  4000    # DD holds pressure far less (was 10000)
variable_exit_retract: 1.0     # DIRECT DRIVE. 10.0 was for the bowden and would
                               # now yank filament out of the melt zone entirely.
gcode:
    {% if not printer.extruder.can_extrude %}
        {action_raise_error("PURGE_AND_WIPE: hotend below min_extrude_temp")}
    {% endif %}
    {% if 'xyz' not in printer.toolhead.homed_axes %}
        {action_raise_error("PURGE_AND_WIPE: home first")}
    {% endif %}

    SAVE_GCODE_STATE NAME=purge_wipe
    G90
    M83

    {% set cur_z = printer.toolhead.position.z|float %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set lift = cur_z + 5 %}
    G1 Z{lift if lift < max_z else max_z} F600

    G1 X{purge_x1} Y{purge_y} F6000
    G1 Z{purge_z} F300
    # PRIME BURST FIRST, stationary. Spreading the whole purge along a 135mm
    # move is only ~1.3 mm/s of filament - far too slow to build pressure in a
    # melt zone that oozed itself empty during the heat soak, so NOTHING came
    # out. Dump a slug here to fill it, then draw the line.
    G1 E{prime_mm} F120
    # Draw half the line, then do the BIG retract mid-bucket and run the rest
    # of the X travel dry. Depressurising here means the ooze and the strand
    # both land in the bucket, and the remaining ~67mm of travel drags the
    # strand off before the nozzle ever leaves it. Retracting at the end (even
    # 5mm) still left it bleeding onto the pad and the plate.
    {% set xmid = (purge_x1 + purge_x2) / 2.0 %}
    G1 X{xmid} E{purge_mm / 2.0} F{purge_feed}
    G1 E-{exit_retract} F2400
    G1 X{purge_x2} F{purge_feed}
    # DWELL over the bucket and let the residual bleed out here. After the
    # retract the melt zone keeps weeping for several seconds under its own
    # heat; waiting it out over the bucket puts that in the foil instead of
    # on the pad and the plate.
    G4 P{ooze_dwell}
    G1 Z4 F600
    G1 X{wipe_x1} F6000
    G1 Z{wipe_z} F300

    {% set seed = (printer.system_stats.cputime * 1000)|int %}
    {% for i in range(wipe_passes|int) %}
        {% set r = ((seed + i * 7919) % 401) / 200.0 - 1.0 %}
        G1 X{wipe_x2} F4000
        G1 Y{purge_y + r * wipe_jitter} F3000
        G1 X{wipe_x1} F4000
    {% endfor %}

    G1 Z{wipe_z + 5} F600
    G92 E0
    RESTORE_GCODE_STATE NAME=purge_wipe

